name: Scrape Webpage

on:
  workflow_dispatch: # এটি ম্যানুয়ালি গিটহব থেকে রান করার সুবিধা দেবে

jobs:
  scrape:
    runs-on: ubuntu-latest

    # গিটহবে ফাইল পুশ করার জন্য পারমিশন দিতে হবে
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install --with-deps chromium

      - name: Run Python Script
        run: python main.py

      # Row_Link ফোল্ডারসহ সব ফাইল গিটহব রিপোজটরিতে সেভ (Commit & Push) করার জন্য আপডেট করা হলো
      - name: Commit and push generated files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add playlist.m3u index.html status.txt Row_Link/
          git commit -m "Auto-generated playlists, Row_Link folder, and status [skip ci]" || echo "No changes to commit"
          git push
